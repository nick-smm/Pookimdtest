<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICK // ROOT ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --cyan: #00f0ff; 
            --cyan-dim: rgba(0, 240, 255, 0.2);
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --bg-dark: #07070a; 
            --card-bg: rgba(17, 17, 24, 0.85);
            --text-main: #e0e0e0;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-dark); 
            background-image: 
                linear-gradient(rgba(7, 7, 10, 0.75), rgba(7, 7, 10, 0.85)), 
                url('https://i.ibb.co/XrbndDhL/temp.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: 'Space Grotesk', sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        /* BGM Toggle Button Styles */
        .audio-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--cyan);
            cursor: pointer;
            z-index: 10;
            text-shadow: 0 0 8px var(--cyan);
            border: 1px solid var(--cyan-dim);
            padding: 5px 10px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .audio-toggle:hover {
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        .container { width: 100%; max-width: 420px; padding: 20px; z-index: 1; }
        
        /* Sci-Fi Cyber Card */
        .card { 
            position: relative;
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.05); /* Faint static border */
            padding: 45px 35px; 
            border-radius: 6px; 
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
            backdrop-filter: blur(10px);
        }

        /* Line Tracing Animation (Snake Border) */
        .card .line {
            position: absolute;
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }

        /* Top Line */
        .card .line:nth-child(1) {
            top: 0; left: -100%;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan));
            animation: line1 2s linear infinite;
        }
        @keyframes line1 {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        /* Right Line */
        .card .line:nth-child(2) {
            top: -100%; right: 0;
            width: 2px; height: 100%;
            background: linear-gradient(180deg, transparent, var(--cyan));
            animation: line2 2s linear infinite;
            animation-delay: 0.5s;
        }
        @keyframes line2 {
            0% { top: -100%; }
            50%, 100% { top: 100%; }
        }

        /* Bottom Line */
        .card .line:nth-child(3) {
            bottom: 0; right: -100%;
            width: 100%; height: 2px;
            background: linear-gradient(270deg, transparent, var(--cyan));
            animation: line3 2s linear infinite;
            animation-delay: 1s;
        }
        @keyframes line3 {
            0% { right: -100%; }
            50%, 100% { right: 100%; }
        }

        /* Left Line */
        .card .line:nth-child(4) {
            bottom: -100%; left: 0;
            width: 2px; height: 100%;
            background: linear-gradient(360deg, transparent, var(--cyan));
            animation: line4 2s linear infinite;
            animation-delay: 1.5s;
        }
        @keyframes line4 {
            0% { bottom: -100%; }
            50%, 100% { bottom: 100%; }
        }

        /* NICK_TERMINAL Blinking/Pulsing Animation */
        h2 {
            font-weight: 700;
            font-size: 1.4rem;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 30px;
            color: var(--cyan);
            text-transform: uppercase;
            animation: neonBlink 2s infinite alternate;
        }

        @keyframes neonBlink {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan-dim);
                opacity: 1;
            }
            20%, 24%, 55% {
                text-shadow: none;
                opacity: 0.4;
            }
        }

        /* Minimal Tech Input */
        input { 
            width: 100%; 
            background: rgba(0, 0, 0, 0.3); 
            border: none;
            border-bottom: 2px solid var(--cyan-dim); 
            color: var(--cyan); 
            padding: 15px 12px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 1rem; 
            outline: none; 
            transition: 0.3s;
            border-radius: 4px 4px 0 0;
        }

        input::placeholder { color: rgba(0, 240, 255, 0.4); }

        input:focus {
            border-bottom: 2px solid var(--cyan);
            background: linear-gradient(to top, rgba(0, 240, 255, 0.1), rgba(0, 0, 0, 0.3));
            box-shadow: 0 10px 10px -10px var(--cyan-glow);
        }
        
        /* Cyberpunk Outline Button */
        button { 
            width: 100%; 
            background: transparent; 
            color: var(--cyan); 
            border: 1px solid var(--cyan); 
            padding: 15px; 
            margin-top: 30px; 
            cursor: pointer; 
            font-weight: 700; 
            letter-spacing: 2px;
            font-family: 'Space Grotesk', sans-serif; 
            text-transform: uppercase;
            transition: all 0.3s ease; 
            position: relative;
            overflow: hidden;
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        button:hover { 
            background: var(--cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan-dim); 
            text-shadow: none;
        }

        .output { 
            margin-top: 25px; 
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem; 
            text-align: center; 
            color: var(--cyan);
            min-height: 20px;
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        .header { 
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem; 
            text-align: center; 
            margin-bottom: 20px; 
            color: rgba(255, 255, 255, 0.5); 
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<!-- Audio Element -->
<audio id="bgAudio" loop>
    <source src="https://xenocdn.xenocdn.workers.dev/70332e75.mp4">
</audio>

<!-- Audio Toggle Button -->
<div class="audio-toggle" id="audioBtn" onclick="toggleAudio()">[ BGM : OFF ]</div>

<div class="container">
    <div class="header">SYS_CORE // SECURE_LINK // V2.0</div>
    <div class="card">
        <!-- 4 Lines for Snake Border Animation -->
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
        
        <h2>NICK_TERMINAL</h2>
        <input type="tel" id="phoneInput" placeholder="> TARGET_PHONE_NO" maxlength="15">
        <button onclick="getPairingCode()" id="pairBtn">INITIALIZE PAIR</button>
        <div id="result" class="output"></div>
    </div>
</div>

<script>
    // Audio Play/Pause Logic
    const bgAudio = document.getElementById('bgAudio');
    const audioBtn = document.getElementById('audioBtn');
    let isPlaying = false;

    function toggleAudio() {
        if (isPlaying) {
            bgAudio.pause();
            audioBtn.innerText = "[ BGM : OFF ]";
            audioBtn.style.color = "var(--cyan)";
            audioBtn.style.boxShadow = "none";
            audioBtn.style.background = "rgba(0, 0, 0, 0.5)";
        } else {
            bgAudio.play().catch(error => {
                console.log("Audio playback failed: ", error);
            });
            audioBtn.innerText = "[ BGM : ON ]";
            audioBtn.style.color = "#fff";
            audioBtn.style.boxShadow = "0 0 15px var(--cyan)";
            audioBtn.style.background = "rgba(0, 240, 255, 0.2)";
        }
        isPlaying = !isPlaying;
    }

    // Pair Code Logic
    async function getPairingCode() {
        const res = document.getElementById('result');
        const num = document.getElementById('phoneInput').value.replace(/[^0-9]/g, '');
        if (num.length < 7) return res.innerHTML = "> ERROR: INVALID_INPUT";
        
        res.innerHTML = "> ESTABLISHING_LINK...";
        try {
            const data = await (await fetch(`/pair?number=${num}`)).json();
            res.innerHTML = data.code ? `> AUTH_KEY: [${data.code}]` : "> ERROR: LINK_FAILED";
        } catch (e) {
            res.innerHTML = "> FATAL: HOST_UNREACHABLE";
        }
    }
</script>

</body>
</html>
